[package]
name = "lumen-launcher"
version = "0.1.0"
description = "A cross-platform Minecraft Java launcher built with Rust and Tauri"
authors = ["Lumen Launcher contributors"]
edition = "2021"

[lib]
name = "lumen_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1" }

[dependencies]
anyhow = "1"
futures-util = "0.3"
flate2 = "1"
hex = "0.4"
keyring = "3"
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tar = "0.4"
tauri = { version = "=2.8.5" }
# Keep Tauri's semver-compatible helper crates within the workspace Rust 1.88 MSRV.
tauri-codegen = "=2.4.0"
tauri-macros = "=2.4.0"
tauri-runtime = "=2.9.2"
tauri-utils = "=2.8.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "=1.17.0", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
